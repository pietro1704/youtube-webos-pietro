name: Build & Release
on:
  push:
    tags: ['v*.*']
permissions:
  contents: read
jobs:
  build:
    name: Build & Test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [legacy, modern]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: ./.github/actions/validate
        with:
          variant: ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.variant }}
          if-no-files-found: error
          path: |
            dist/*_all.ipk
            dist/*.manifest.json
            dist/build-info.json
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v4
        with:
          name: release-legacy
          path: packages/legacy
      - uses: actions/download-artifact@v4
        with:
          name: release-modern
          path: packages/modern
      - name: Verify and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/prepare-release.cjs packages release-assets "$RELEASE_TAG" --require-clean
      - uses: ncipollo/release-action@v1
        with:
          prerelease: true
          artifactErrorsFailBuild: true
          artifacts: 'release-assets/*'
