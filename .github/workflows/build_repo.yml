name: Catalog from published release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified release catalog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --pattern repo.json --dir catalog
      - uses: actions/upload-artifact@v4
        with:
          name: published-catalog
          path: catalog/repo.json
          if-no-files-found: error
