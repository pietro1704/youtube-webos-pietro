name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [legacy, modern]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - name: Lint and type-check
        if: matrix.variant == 'legacy'
        run: npm run lint && npm run type-check
      - name: Build and test legacy bundle
        if: matrix.variant == 'legacy'
        run: npm test
      - name: Build and test modern bundle
        if: matrix.variant == 'modern'
        run: npm run build:modern && npm run test:modern
      - run: npm run package
      - run: npm run manifest

      - name: Upload tested package
        uses: actions/upload-artifact@v4
        with:
          name: youtube_adfree_${{ matrix.variant }}_${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/youtube.leanback.v4_*_all.ipk
            dist/*.manifest.json
